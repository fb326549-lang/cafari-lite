name: MyCar Browser iOS Build

on:
  push:
    branches:
      - mycar-browser-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for physical iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CafariLite.xcodeproj \
            -target CafariLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CAFARI_LITE_BUNDLE_ID=com.fb326549.mycarbrowser \
            CAFARI_LITE_TEAM='' \
            CAFARI_LITE_ENTITLEMENTS='' \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned app for inspection
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/build/CafariLite.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/MyCar-Browser-unsigned.ipa" Payload

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-Browser-unsigned-ipa
          path: MyCar-Browser-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
